# This file starts all backend services together.

services:
  # The PostgreSQL database.
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: soil_user
      POSTGRES_PASSWORD: soil_pass
      POSTGRES_DB: soil_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./api/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soil_user -d soil_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # The Go API service.
  api:
    build: ./api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgres://soil_user:soil_pass@db:5432/soil_db"

      # NEW: where to find the AI service.
      #
      # NOT localhost. Inside a container, "localhost" means THAT
      # container itself. Docker Compose makes a private network
      # where each service is reachable by its SERVICE NAME.
      AI_SERVICE_URL: "http://ai:8000"
    depends_on:
      db:
        condition: service_healthy
      ai:                    # NEW: wait for the AI service to start
        condition: service_started

  # The FastAPI AI service.
  ai:
    build: ./ai
    ports:
      - "8000:8000"
    environment:
      # NEW: the LLM settings, read from the .env file.
      #
      # The ${...} syntax reads from .env automatically.
      # The KEY NEVER APPEARS IN THIS FILE, so it is safe in Git.
      LLM_BASE_URL: "${LLM_BASE_URL}"
      LLM_API_KEY: "${LLM_API_KEY}"
      LLM_MODEL: "${LLM_MODEL}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-text-embedding-3-small}"
      WEB_SEARCH_MODEL: "${WEB_SEARCH_MODEL:-gpt-5-mini}"
      BOOKS_DIR: /code/books
      RAG_INDEX_DIR: /code/data
      PINECONE_API_KEY: "${PINECONE_API_KEY:-}"
      PINECONE_INDEX: "${PINECONE_INDEX:-soil-advisor-books}"
      PINECONE_NAMESPACE: "${PINECONE_NAMESPACE:-soil-books}"
      PINECONE_CLOUD: "${PINECONE_CLOUD:-aws}"
      PINECONE_REGION: "${PINECONE_REGION:-us-east-1}"
      PINECONE_DIMENSION: "${PINECONE_DIMENSION:-1536}"
      SL_AGRICULTURE_DOMAINS: "${SL_AGRICULTURE_DOMAINS:-doa.gov.lk}"
      AGRICULTURE_DOMAINS: "${AGRICULTURE_DOMAINS:-fao.org,irri.org,cimmyt.org,icrisat.org,cabi.org}"
    volumes:
      - ./ai/books:/code/books:ro
      - rag_data:/code/data

volumes:
  db_data:
  rag_data:
