# This file starts all backend services together.

services:
  # The PostgreSQL database.
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: soil_user
      POSTGRES_PASSWORD: soil_pass
      POSTGRES_DB: soil_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./api/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soil_user -d soil_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # The Go API service.
  api:
    build: ./api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgres://soil_user:soil_pass@db:5432/soil_db"

      # NEW: where to find the AI service.
      #
      # NOT localhost. Inside a container, "localhost" means THAT
      # container itself. Docker Compose makes a private network
      # where each service is reachable by its SERVICE NAME.
      AI_SERVICE_URL: "http://ai:8000"
    depends_on:
      db:
        condition: service_healthy
      ai:                    # NEW: wait for the AI service to start
        condition: service_started

  # The FastAPI AI service.
  ai:
    build: ./ai
    ports:
      - "8000:8000"

volumes:
  db_data:
